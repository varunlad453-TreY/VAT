apiVersion: batch/v1
kind: Job
metadata:
  name: vat-alembic-migration-baseline
  namespace: vat-system
  labels:
    app.kubernetes.io/name: vat-database-migration
    app.kubernetes.io/component: migration
    app.kubernetes.io/part-of: vat-enterprise
  annotations:
    # ArgoCD / Helm Hook: Run before syncing deployment rollout
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "-5"
    helm.sh/hook-delete-policy: hook-succeeded,before-hook-creation
    argocd.argoproj.io/hook: PreSync
    argocd.argoproj.io/hook-delete-policy: HookSucceeded
spec:
  backoffLimit: 3
  activeDeadlineSeconds: 300
  ttlSecondsAfterFinished: 600
  template:
    metadata:
      labels:
        app.kubernetes.io/name: vat-database-migration
    spec:
      restartPolicy: OnFailure
      containers:
        - name: alembic-migrator
          image: vat-backend:latest
          imagePullPolicy: IfNotPresent
          command: ["python", "-m", "alembic", "upgrade", "head"]
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: vat-database-secrets
                  key: database-url
          resources:
            limits:
              cpu: "500m"
              memory: "512Mi"
            requests:
              cpu: "100m"
              memory: "128Mi"
          securityContext:
            readOnlyRootFilesystem: false
            runAsNonRoot: true
            runAsUser: 10001
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
