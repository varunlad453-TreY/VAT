apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: vat-enterprise-root
  namespace: argocd
  labels:
    app.kubernetes.io/name: vat-enterprise-root
    app.kubernetes.io/part-of: vat-enterprise
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/varunlad453-TreY/VAT.git
    targetRevision: HEAD
    path: k8s
    directory:
      recurse: true
  destination:
    server: https://kubernetes.default.svc
    namespace: vat-system
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ApplyOutOfSyncOnly=true
      - PrunePropagationPolicy=foreground
      - PruneLast=true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
