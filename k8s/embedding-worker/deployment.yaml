apiVersion: apps/v1
kind: Deployment
metadata:
  name: vat-embedding-worker
  namespace: vat-system
  labels:
    app.kubernetes.io/name: vat-embedding-worker
    app.kubernetes.io/component: inference
    app.kubernetes.io/part-of: vat-enterprise
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: vat-embedding-worker
  template:
    metadata:
      labels:
        app.kubernetes.io/name: vat-embedding-worker
        app.kubernetes.io/component: inference
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8001"
        prometheus.io/path: "/metrics"
    spec:
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchExpressions:
                    - key: app.kubernetes.io/name
                      operator: In
                      values:
                        - vat-embedding-worker
                topologyKey: kubernetes.io/hostname
      containers:
        - name: embedding-worker
          image: vat-embedding-worker:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8001
              protocol: TCP
          env:
            - name: EMBEDDING_MODEL
              value: "all-MiniLM-L6-v2"
            - name: EMBEDDING_DIMENSION
              value: "384"
            - name: LOG_LEVEL
              value: "INFO"
          resources:
            requests:
              cpu: "1000m"
              memory: "2Gi"
            limits:
              cpu: "2000m"
              memory: "4Gi"
              # Optional GPU node allocation:
              # nvidia.com/gpu: "1"
          readinessProbe:
            httpGet:
              path: /health
              port: 8001
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 2
            successThreshold: 1
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health
              port: 8001
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          securityContext:
            readOnlyRootFilesystem: false
            runAsNonRoot: false
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
