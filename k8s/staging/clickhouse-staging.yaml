apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: vat-clickhouse-staging
  namespace: vat-staging
  labels:
    app.kubernetes.io/name: vat-clickhouse
    app.kubernetes.io/environment: staging
spec:
  serviceName: vat-clickhouse-staging-headless
  replicas: 1
  updateStrategy:
    type: RollingUpdate
  selector:
    matchLabels:
      app.kubernetes.io/name: vat-clickhouse
      app.kubernetes.io/environment: staging
  template:
    metadata:
      labels:
        app.kubernetes.io/name: vat-clickhouse
        app.kubernetes.io/environment: staging
    spec:
      containers:
        - name: clickhouse
          image: clickhouse/clickhouse-server:24.3-alpine
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8123
            - name: native
              containerPort: 9000
          env:
            - name: CLICKHOUSE_DB
              value: "vat_telemetry"
            - name: CLICKHOUSE_USER
              value: "default"
            - name: CLICKHOUSE_PASSWORD
              value: ""
          resources:
            requests:
              cpu: "1000m"
              memory: "2Gi"
            limits:
              cpu: "2000m"
              memory: "4Gi"
          readinessProbe:
            httpGet:
              path: /ping
              port: 8123
            initialDelaySeconds: 5
            periodSeconds: 5
          volumeMounts:
            - name: clickhouse-data
              mountPath: /var/lib/clickhouse
            - name: clickhouse-init
              mountPath: /docker-entrypoint-initdb.d
      volumes:
        - name: clickhouse-init
          configMap:
            name: vat-clickhouse-staging-init
  volumeClaimTemplates:
    - metadata:
        name: clickhouse-data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 50Gi
---
apiVersion: v1
kind: Service
metadata:
  name: vat-clickhouse-staging-service
  namespace: vat-staging
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: vat-clickhouse
    app.kubernetes.io/environment: staging
  ports:
    - name: http
      port: 8123
      targetPort: 8123
    - name: native
      port: 9000
      targetPort: 9000
