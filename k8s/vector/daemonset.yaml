apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: vat-vector-agent
  namespace: vat-system
  labels:
    app.kubernetes.io/name: vat-vector-agent
    app.kubernetes.io/component: edge-ingestion
    app.kubernetes.io/part-of: vat-enterprise
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: vat-vector-agent
  template:
    metadata:
      labels:
        app.kubernetes.io/name: vat-vector-agent
        app.kubernetes.io/component: edge-ingestion
    spec:
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      containers:
        - name: vector
          image: timberio/vector:0.38.0-distroless-libc
          imagePullPolicy: IfNotPresent
          args: ["--config", "/etc/vector/vector.yaml"]
          ports:
            - name: syslog-udp
              containerPort: 514
              hostPort: 514
              protocol: UDP
            - name: syslog-tcp
              containerPort: 1514
              hostPort: 1514
              protocol: TCP
            - name: http-bulk
              containerPort: 8088
              protocol: TCP
          resources:
            requests:
              cpu: "500m"
              memory: "512Mi"
            limits:
              cpu: "2000m"
              memory: "2Gi"
          volumeMounts:
            - name: vector-config
              mountPath: /etc/vector/vector.yaml
              subPath: vector.yaml
              readOnly: true
            - name: vector-data
              mountPath: /var/lib/vector
      volumes:
        - name: vector-config
          configMap:
            name: vat-vector-config
        - name: vector-data
          hostPath:
            path: /var/log/vat-vector
            type: DirectoryOrCreate
---
apiVersion: v1
kind: Service
metadata:
  name: vat-vector-service
  namespace: vat-system
  labels:
    app.kubernetes.io/name: vat-vector-service
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: vat-vector-agent
  ports:
    - name: syslog-udp
      port: 514
      targetPort: 514
      protocol: UDP
    - name: syslog-tcp
      port: 1514
      targetPort: 1514
      protocol: TCP
    - name: http-bulk
      port: 8088
      targetPort: 8088
      protocol: TCP
