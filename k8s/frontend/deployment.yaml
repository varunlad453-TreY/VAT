apiVersion: apps/v1
kind: Deployment
metadata:
  name: vat-noc-frontend
  namespace: vat-system
  labels:
    app.kubernetes.io/name: vat-noc-frontend
    app.kubernetes.io/component: ui-gateway
    app.kubernetes.io/part-of: vat-enterprise
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: vat-noc-frontend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: vat-noc-frontend
        app.kubernetes.io/component: ui-gateway
    spec:
      containers:
        - name: nextjs-app
          image: vat-frontend:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 3000
              protocol: TCP
          env:
            - name: NODE_ENV
              value: "production"
            - name: NEXT_PUBLIC_API_BASE_URL
              value: "http://vat-backend-service.vat-system.svc.cluster.local:8000"
            - name: NEXT_PUBLIC_WS_BASE_URL
              value: "ws://vat-backend-service.vat-system.svc.cluster.local:8000"
            - name: LEGACY_CONSOLE_URL
              value: "http://vat-legacy-console-service.vat-system.svc.cluster.local:3001"
          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
            limits:
              cpu: "1000m"
              memory: "1Gi"
          readinessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 10
