apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: vat-qdrant
  namespace: vat-system
  labels:
    app.kubernetes.io/name: vat-qdrant
    app.kubernetes.io/component: distributed-vector-rag
    app.kubernetes.io/part-of: vat-enterprise
spec:
  serviceName: vat-qdrant-headless
  replicas: 1
  updateStrategy:
    type: RollingUpdate
  selector:
    matchLabels:
      app.kubernetes.io/name: vat-qdrant
  template:
    metadata:
      labels:
        app.kubernetes.io/name: vat-qdrant
        app.kubernetes.io/component: distributed-vector-rag
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "6333"
        prometheus.io/path: "/metrics"
    spec:
      containers:
        - name: qdrant
          image: qdrant/qdrant:v1.8.4
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 6333
              protocol: TCP
            - name: grpc
              containerPort: 6334
              protocol: TCP
          env:
            - name: QDRANT__SERVICE__GRPC_PORT
              value: "6334"
            - name: QDRANT__SERVICE__HTTP_PORT
              value: "6333"
            - name: QDRANT__STORAGE__ON_DISK_PAYLOAD
              value: "true"
          resources:
            requests:
              cpu: "1000m"
              memory: "2Gi"
            limits:
              cpu: "4000m"
              memory: "8Gi"
          readinessProbe:
            httpGet:
              path: /readyz
              port: 6333
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /livez
              port: 6333
            initialDelaySeconds: 10
            periodSeconds: 10
          volumeMounts:
            - name: qdrant-data
              mountPath: /qdrant/storage
  volumeClaimTemplates:
    - metadata:
        name: qdrant-data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 50Gi
---
apiVersion: v1
kind: Service
metadata:
  name: vat-qdrant-service
  namespace: vat-system
  labels:
    app.kubernetes.io/name: vat-qdrant-service
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: vat-qdrant
  ports:
    - name: http
      port: 6333
      targetPort: 6333
      protocol: TCP
    - name: grpc
      port: 6334
      targetPort: 6334
      protocol: TCP
