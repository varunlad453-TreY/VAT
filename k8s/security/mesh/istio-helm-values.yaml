# Istio Production Control Plane Configuration - Zero-Trust Profile
# Helm Release: istiod / istio-base
# Repository: https://istio-release.storage.googleapis.com/charts

global:
  istioNamespace: istio-system
  jwtPolicy: third-party-jwt
  logAsJson: true
  proxy:
    # Zero-Trust / Race condition guard: Hold application container until Envoy is listening
    holdApplicationUntilProxyStarts: true
    autoInject: enabled
    resources:
      requests:
        cpu: 100m
        memory: 128Mi
      limits:
        cpu: 1000m
        memory: 512Mi

meshConfig:
  # Cryptographic Identity & Zero-Trust
  trustDomain: cluster.local
  enableAutoMtls: true
  defaultConfig:
    holdApplicationUntilProxyStarts: true
    proxyMetadata:
      # Enable Istio DNS proxying for transparent service discovery
      ISTIO_META_DNS_CAPTURE: "true"
      ISTIO_META_DNS_AUTO_ALLOCATE: "true"

  # Zero-Trust Egress: Block any egress to arbitrary hosts not explicitly defined in ServiceEntry
  outboundTrafficPolicy:
    mode: REGISTRY_ONLY

  # Standardized Structured Security Audit Logging
  accessLogFile: /dev/stdout
  accessLogEncoding: JSON
  accessLogFormat: |
    {
      "start_time": "%START_TIME%",
      "method": "%REQ(:METHOD)%",
      "path": "%REQ(X-ENVOY-ORIGINAL-PATH?:PATH)%",
      "protocol": "%PROTOCOL%",
      "response_code": "%RESPONSE_CODE%",
      "response_flags": "%RESPONSE_FLAGS%",
      "bytes_received": "%BYTES_RECEIVED%",
      "bytes_sent": "%BYTES_SENT%",
      "duration": "%DURATION%",
      "upstream_service_time": "%RESP(X-ENVOY-UPSTREAM-SERVICE-TIME)%",
      "x_forwarded_for": "%REQ(X-FORWARDED-FOR)%",
      "user_agent": "%REQ(USER-AGENT)%",
      "request_id": "%REQ(X-REQUEST-ID)%",
      "authority": "%REQ(:AUTHORITY)%",
      "upstream_host": "%UPSTREAM_HOST%",
      "upstream_cluster": "%UPSTREAM_CLUSTER%",
      "downstream_local_address": "%DOWNSTREAM_LOCAL_ADDRESS%",
      "downstream_remote_address": "%DOWNSTREAM_REMOTE_ADDRESS%",
      "requested_server_name": "%REQUESTED_SERVER_NAME%",
      "source_principal": "%DYNAMIC_METADATA(istio.authz:principal)%",
      "destination_principal": "%UPSTREAM_PEER(spiffe)%"
    }

pilot:
  autoscaleEnabled: true
  autoscaleMin: 2
  autoscaleMax: 5
  resources:
    requests:
      cpu: 500m
      memory: 1024Mi
    limits:
      cpu: 2000m
      memory: 2048Mi

# Istio CNI Plugin: Eliminates NET_ADMIN & NET_RAW privileges for application pods
cni:
  enabled: true
  cniBinDir: /opt/cni/bin
  cniConfDir: /etc/cni/net.d
  cniConfFileName: 10-istio-cni.conflist
