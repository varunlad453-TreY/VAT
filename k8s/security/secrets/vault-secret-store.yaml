# ==============================================================================
# ServiceAccount for External Secrets Operator Authentication to Vault
# Zero static tokens; authenticates using Projected SA Token (Kubernetes JWT)
# ==============================================================================
apiVersion: v1
kind: ServiceAccount
metadata:
  name: vat-eso-vault-sa
  namespace: vat-system
  labels:
    app.kubernetes.io/name: vat-eso-vault-sa
    app.kubernetes.io/part-of: vat-enterprise
---
# ClusterRole & Binding allowing ESO to validate TokenRequests
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: vat-eso-vault-tokenreview-binding
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: system:auth-delegator
subjects:
  - kind: ServiceAccount
    name: vat-eso-vault-sa
    namespace: vat-system
---
# ==============================================================================
# ClusterSecretStore: HashiCorp Vault (Primary Engine)
# Authenticates dynamically to HashiCorp Vault via auth/kubernetes
# ==============================================================================
apiVersion: external-secrets.io/v1beta1
kind: ClusterSecretStore
metadata:
  name: vat-vault-backend
  labels:
    app.kubernetes.io/name: vat-vault-backend
    app.kubernetes.io/part-of: vat-enterprise
spec:
  provider:
    vault:
      # In-cluster Vault Service or External HCP Vault URI
      server: "http://vault.vault.svc.cluster.local:8200"
      path: "database"
      version: "v2"
      auth:
        kubernetes:
          mountPath: "kubernetes"
          role: "vat-eso-role"
          serviceAccountRef:
            name: vat-eso-vault-sa
            namespace: vat-system
---
# ==============================================================================
# ClusterSecretStore: AWS Secrets Manager (Alternative / Cloud-Native Fallback)
# Authenticates using IAM Roles for Service Accounts (IRSA) with zero static access keys
# ==============================================================================
apiVersion: external-secrets.io/v1beta1
kind: ClusterSecretStore
metadata:
  name: vat-aws-secrets-manager
  labels:
    app.kubernetes.io/name: vat-aws-secrets-manager
    app.kubernetes.io/part-of: vat-enterprise
spec:
  provider:
    aws:
      service: SecretsManager
      region: "ap-south-1"
      auth:
        jwt:
          serviceAccountRef:
            name: vat-eso-vault-sa
            namespace: vat-system
