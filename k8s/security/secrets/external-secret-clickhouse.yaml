# ==============================================================================
# ExternalSecret: ClickHouse Hot Analytics Credentials
# Eliminates empty/default passwords; injects SHA256-authenticated credentials
# ==============================================================================
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: vat-clickhouse-secrets
  namespace: vat-system
  labels:
    app.kubernetes.io/name: vat-clickhouse-secrets
    app.kubernetes.io/part-of: vat-enterprise
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: vat-vault-backend

  target:
    name: vat-clickhouse-secrets
    creationPolicy: Owner
    template:
      engineVersion: v2
      metadata:
        labels:
          app.kubernetes.io/part-of: vat-enterprise
        annotations:
          reloader.stakater.com/match: "true"
      data:
        CLICKHOUSE_USER: "{{ .username }}"
        CLICKHOUSE_PASSWORD: "{{ .password }}"
        CLICKHOUSE_DB: "vat_telemetry"
        CLICKHOUSE_HOST: "vat-clickhouse-service.vat-storage.svc.cluster.local"
        CLICKHOUSE_PORT: "8123"
        CLICKHOUSE_URL: "http://{{ .username }}:{{ .password }}@vat-clickhouse-service.vat-storage.svc.cluster.local:8123/vat_telemetry"

  data:
    - secretKey: username
      remoteRef:
        key: secret/data/vat/clickhouse
        property: username
    - secretKey: password
      remoteRef:
        key: secret/data/vat/clickhouse
        property: password
