# ==============================================================================
# ExternalSecret: PostgreSQL Dynamic Credentials
# Requests ephemeral database role credentials from HashiCorp Vault
# Reconciles into native v1/Secret 'vat-database-credentials' every 1 hour
# ==============================================================================
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: vat-database-secrets
  namespace: vat-system
  labels:
    app.kubernetes.io/name: vat-database-secrets
    app.kubernetes.io/part-of: vat-enterprise
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: vat-vault-backend

  target:
    name: vat-database-secrets
    creationPolicy: Owner
    template:
      engineVersion: v2
      metadata:
        labels:
          app.kubernetes.io/part-of: vat-enterprise
        annotations:
          # Stakater Reloader annotation to auto-bounce pods cleanly upon credential rotation
          reloader.stakater.com/match: "true"
      data:
        POSTGRES_USER: "{{ .username }}"
        POSTGRES_PASSWORD: "{{ .password }}"
        # Clean asyncpg connection string consumed by FastAPI Backend
        DATABASE_URL: "postgresql+asyncpg://{{ .username }}:{{ .password }}@vat-postgres-service.vat-storage.svc.cluster.local:5432/vat"
        # Standard sync connection string consumed by Alembic migration jobs
        database-url: "postgresql://{{ .username }}:{{ .password }}@vat-postgres-service.vat-storage.svc.cluster.local:5432/vat"

  data:
    # Vault Database Engine Path: database/creds/vat-backend-role
    - secretKey: username
      remoteRef:
        key: database/creds/vat-backend-role
        property: username
    - secretKey: password
      remoteRef:
        key: database/creds/vat-backend-role
        property: password
