# External Secrets Operator Production Configuration
# Chart: external-secrets/external-secrets
# Version: 0.9.x+

installCRDs: true

replicaCount: 2

leaderElect: true

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 512Mi

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  runAsNonRoot: true
  runAsUser: 10001
  capabilities:
    drop:
      - ALL

serviceAccount:
  create: true
  name: external-secrets-operator
  annotations:
    # Optional Cloud IAM Workload Identity mapping (e.g. AWS EKS IRSA or GCP Workload Identity)
    eks.amazonaws.com/role-arn: ""

# Prometheus Metrics & Alerting
metrics:
  service:
    enabled: true
    port: 8080
  serviceMonitor:
    enabled: true
    interval: 30s

# Webhook & CertController validation
webhook:
  replicaCount: 2
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 200m
      memory: 256Mi

certController:
  replicaCount: 1
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 200m
      memory: 256Mi
