# ==============================================================================
# Vector.dev Dual-Sink Mirroring Configuration (Zero-Impact Production Mirror)
# Mirroring: Destination A (Legacy Production) & Destination B (Redpanda Staging)
# ==============================================================================

data_dir = "/var/lib/vector"

# ──────────────────────────────────────────────────────────────────────────────
# 1. SOURCES (Edge Syslog Listeners)
# ──────────────────────────────────────────────────────────────────────────────
[sources.syslog_udp]
type = "syslog"
address = "0.0.0.0:514"
mode = "udp"
max_length = 65536

[sources.syslog_tcp]
type = "syslog"
address = "0.0.0.0:1514"
mode = "tcp"
max_length = 65536

[sources.http_telemetry]
type = "http_server"
address = "0.0.0.0:8088"
path = "/telemetry/bulk"

# ──────────────────────────────────────────────────────────────────────────────
# 2. TRANSFORMS (Noise Filter & Multi-Vendor Normalizer)
# ──────────────────────────────────────────────────────────────────────────────
[transforms.filter_noise]
type = "filter"
inputs = ["syslog_udp", "syslog_tcp", "http_telemetry"]
condition = '!contains(string!(.message), "DEBUG") && !contains(string!(.message), "AUTHPRIV-7")'

[transforms.normalize_telemetry]
type = "remap"
inputs = ["filter_noise"]
source = '''
.raw_log = string!(.message)
.received_at = now()
.ingest_node = get_hostname!()

msg = downcase(string!(.raw_log))

# Vendor Classification
if contains(msg, "cisco") || contains(.raw_log, "%BGP-") || contains(.raw_log, "%OSPF-") || contains(.raw_log, "%LINK-") {
    .vendor = "cisco"
    .protocol = if contains(msg, "bgp") { "bgp" } else if contains(msg, "ospf") { "ospf" } else { "interface" }
} else if contains(msg, "juniper") || contains(.raw_log, "rpd[") || contains(.raw_log, "RPD_") {
    .vendor = "juniper"
    .protocol = if contains(msg, "bgp") { "bgp" } else if contains(msg, "ospf") { "ospf" } else { "interface" }
} else if contains(msg, "velocloud") || contains(msg, "velobrain") || contains(msg, "vcmp") || contains(msg, "edge_link") {
    .vendor = "velocloud"
    .protocol = "ipsec"
} else if contains(msg, "arista") || contains(.raw_log, "%MLAG-") || contains(.raw_log, "%VXLAN-") {
    .vendor = "arista"
    .protocol = "evpn"
} else {
    .vendor = "generic"
    .protocol = "general"
}

# Severity Normalization
if contains(msg, "down") || contains(msg, "dead") || contains(msg, "split_brain") || contains(msg, "expired") {
    .severity = "CRITICAL"
} else if contains(msg, "degraded") || contains(msg, "retransmission") || contains(msg, "loss") || contains(msg, "mismatch") {
    .severity = "ERROR"
} else if contains(msg, "warning") || contains(msg, "flap") {
    .severity = "WARNING"
} else {
    .severity = "INFO"
}

.device_id = string(.host) ?? "Edge-Router-Collector"
'''

# ──────────────────────────────────────────────────────────────────────────────
# 3. DUAL-SINK MIRRORING (Safe Mirror Architecture)
# ──────────────────────────────────────────────────────────────────────────────

# --- DESTINATION A: Legacy Production Ingestion (Zero Impact) ---
[sinks.legacy_production_sink]
type = "http"
inputs = ["normalize_telemetry"]
uri = "http://vat-backend-service.vat-system.svc.cluster.local:8000/telemetry/ingest"
method = "post"
encoding.codec = "json"

[sinks.legacy_production_sink.buffer]
type = "memory"
max_events = 10000
when_full = "drop_newest" # Guarantee legacy pipeline never stalls router UDP socket

[sinks.legacy_production_sink.request]
timeout_secs = 2
retry_attempts = 2

# --- DESTINATION B: New Redpanda Event Streaming Backbone ---
[sinks.redpanda_staging_sink]
type = "kafka"
inputs = ["normalize_telemetry"]
bootstrap_servers = "vat-redpanda-staging-service.vat-staging.svc.cluster.local:9092"
topic = "vat.telemetry.parsed"
encoding.codec = "json"

[sinks.redpanda_staging_sink.buffer]
type = "disk"
max_size = 10737418240 # 10 GB disk buffer to isolate staging backpressure
when_full = "block"
