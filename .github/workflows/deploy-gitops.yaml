name: VAT GitOps Continuous Delivery

on:
  push:
    branches: [main]

concurrency:
  group: gitops-deploy
  cancel-in-progress: false

jobs:
  build-and-push:
    name: Containerize & GitOps Manifest Update
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Backend Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile
          push: false
          tags: ghcr.io/${{ github.repository }}/vat-backend:${{ github.sha }}

      - name: Build Embedding Microservice Image
        uses: docker/build-push-action@v5
        with:
          context: services/embedding_service
          file: services/embedding_service/Dockerfile
          push: false
          tags: ghcr.io/${{ github.repository }}/vat-embedding-worker:${{ github.sha }}

      - name: Build Frontend Gateway Image
        uses: docker/build-push-action@v5
        with:
          context: frontend
          file: frontend/Dockerfile
          push: false
          tags: ghcr.io/${{ github.repository }}/vat-frontend:${{ github.sha }}

      - name: GitOps Manifest Sync & Release Tagging
        run: |
          echo "Syncing GitOps manifests for commit ${{ github.sha }}..."
          # Update image references in k8s deployment manifests
          sed -i 's|image: vat-embedding-worker:latest|image: ghcr.io/${{ github.repository }}/vat-embedding-worker:${{ github.sha }}|g' k8s/embedding-worker/deployment.yaml
          sed -i 's|image: vat-frontend:latest|image: ghcr.io/${{ github.repository }}/vat-frontend:${{ github.sha }}|g' k8s/frontend/deployment.yaml
          echo "Manifests successfully pinned to immutable SHA ${{ github.sha }}."
