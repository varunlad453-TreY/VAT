name: VAT Enterprise CI Pipeline

on:
  push:
    branches: [main, staging]
  pull_request:
    branches: [main, staging]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-test:
    name: Backend Regression & Polyglot Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r services/embedding_service/requirements.txt

      - name: Run Full Automated Test Suite
        run: |
          pytest tests/ -v --junitxml=test-results.xml

  frontend-build:
    name: Turborepo Monorepo & Next.js Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install Monorepo Dependencies
        run: |
          npm ci
          cd frontend && npm ci

      - name: Next.js Standalone Production Build
        run: |
          cd frontend && npm run build
        env:
          NODE_ENV: production
          NEXT_PUBLIC_API_BASE_URL: "http://vat-backend-service.vat-system.svc.cluster.local:8000"
          NEXT_PUBLIC_WS_BASE_URL: "ws://vat-backend-service.vat-system.svc.cluster.local:8000"

  manifest-lint:
    name: Kubernetes & GitOps Manifest Validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Validate YAML Syntax
        run: |
          python -c "
          import yaml, glob
          files = glob.glob('k8s/**/*.yaml', recursive=True) + glob.glob('.github/**/*.yaml', recursive=True)
          for f in files:
              with open(f, 'r', encoding='utf-8') as fp:
                  list(yaml.safe_load_all(fp))
          print(f'Successfully validated {len(files)} YAML manifests.')
          "
