services:
  # ───────────────────────────────────────────────────────────────────────────
  # 1. PostgreSQL 16 with pgvector Extension
  # ───────────────────────────────────────────────────────────────────────────
  postgres:
    image: pgvector/pgvector:pg16
    container_name: vat-postgres
    restart: unless-stopped
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-vat}
      POSTGRES_USER: ${POSTGRES_USER:-vat}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-vat_password}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./schemas/postgres:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-vat} -d ${POSTGRES_DB:-vat}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - vat-network

  # ───────────────────────────────────────────────────────────────────────────
  # 2. Redis Cache & Event Queue
  # ───────────────────────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: vat-redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s
    networks:
      - vat-network

  # ───────────────────────────────────────────────────────────────────────────
  # 3. VAT Backend API (FastAPI Clean Architecture)
  # ───────────────────────────────────────────────────────────────────────────
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: vat-backend
    restart: unless-stopped
    ports:
      - "${API_PORT:-8001}:8000"
    environment:
      - ENVIRONMENT=${ENVIRONMENT:-development}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_DB=${POSTGRES_DB:-vat}
      - POSTGRES_USER=${POSTGRES_USER:-vat}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-vat_password}
      - REDIS_URL=redis://redis:6379/0
      - EMBEDDING_MODEL=${EMBEDDING_MODEL:-all-MiniLM-L6-v2}
      - EMBEDDING_DIMENSION=384
      - GITHUB_TOKEN=${GITHUB_TOKEN:-}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - AI_MODEL=${AI_MODEL:-gpt-4o-mini}
      - AI_BASE_URL=${AI_BASE_URL:-https://models.inference.ai.azure.com}
    volumes:
      - ./backend:/app/backend
      - ./config:/app/config
      - ./docs:/app/docs
      - ./schemas:/app/schemas
      - ./scripts:/app/scripts
      - ./frontend:/app/frontend
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - vat-network

  # ───────────────────────────────────────────────────────────────────────────
  # 4. VAT Modern NOC Console Frontend (Next.js / React)
  # ───────────────────────────────────────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: vat-frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_BASE_URL=http://localhost:8000
      - NEXT_PUBLIC_WS_BASE_URL=ws://localhost:8000
    depends_on:
      - backend
    networks:
      - vat-network

volumes:
  postgres_data:
    name: vat_postgres_data
  redis_data:
    name: vat_redis_data

networks:
  vat-network:
    name: vat-enterprise-network
    driver: bridge
