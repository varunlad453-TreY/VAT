version: '3.8'

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: vat-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: vat
      POSTGRES_USER: vat
      POSTGRES_PASSWORD: vat_password
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./schemas/postgres:/docker-entrypoint-initdb.d:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vat -d vat"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
