# ==============================================================================
# Alembic Configuration for VAT Enterprise (PostgreSQL 16 / pgvector)
# ==============================================================================

[alembic]
# Path to migration environment scripts
script_location = alembic

# Template used to generate migration file names
file_template = %%(rev)s_%%(slug)s

# Prepend sys.path with project root so application imports resolve
prepend_sys_path = .

# Timezone for revision timestamps (UTC for carrier-grade consistency)
timezone = UTC

# Maximum length of characters for the slug field
truncate_slug_length = 40

# Set to 'true' to run the environment during the 'revision' command
revision_environment = false

# Set to 'true' to allow .pyc and .pyo files without .py source files
sourceless = false

# Version table configuration
version_table = alembic_version
version_table_schema = public

# Logging configuration
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
